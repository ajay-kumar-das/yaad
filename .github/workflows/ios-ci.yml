name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort | tail -n 1)"
          if [[ -n "$XCODE_PATH" ]]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '/Xcode/{split($2, parts, "."); print parts[1]}')"
          test "$XCODE_MAJOR" -ge 26

      - name: Validate content
        run: python3 Scripts/validate_content.py

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Prepare simulator
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID="$(
            xcrun simctl list devices available -j |
            python3 -c 'import json, sys; data = json.load(sys.stdin); runtimes = sorted((key for key in data["devices"] if ".iOS-" in key), key=lambda key: tuple(map(int, key.rsplit(".iOS-", 1)[1].split("-"))), reverse=True); devices = [device for runtime in runtimes for device in data["devices"][runtime] if device.get("isAvailable") and device["name"].startswith("iPhone")]; print(devices[0]["udid"] if devices else "")'
          )"
          test -n "$DEVICE_ID"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          echo "DEBUG_DERIVED_DATA=$RUNNER_TEMP/jomado-debug-derived-data" >> "$GITHUB_ENV"

          # Boot asynchronously so simulator startup overlaps the compiler pass.
          xcrun simctl boot "$DEVICE_ID" >/dev/null 2>&1 || true

      - name: Build for testing and compiler diagnostics
        id: compiler_diagnostics
        shell: bash
        run: |
          set -u
          set -o pipefail
          set +e

          rm -rf "$DEBUG_DERIVED_DATA"
          rm -f compiler-diagnostic.log

          xcodebuild \
            -quiet \
            -project Jomado.xcodeproj \
            -scheme Jomado \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$DEBUG_DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_COMPILATION_MODE=wholemodule \
            SWIFT_STRICT_CONCURRENCY=complete \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build-for-testing 2>&1 | tee compiler-diagnostic.log
          BUILD_STATUS=${PIPESTATUS[0]}

          DIAGNOSTICS="$(
            grep -hE \
              'error:|warning:|fatal error:|risks causing data races|unable to type-check|BUILD FAILED' \
              compiler-diagnostic.log || true
          )"

          {
            echo "## Xcode build-for-testing diagnostics"
            echo
            echo "- Exit status: $BUILD_STATUS"
            echo "- App, Live Activity extension, and tests compiled in one pass"
            echo
            echo '```text'
            if [[ -n "$DIAGNOSTICS" ]]; then
              printf '%s\n' "$DIAGNOSTICS"
            else
              echo "No compiler errors or warnings found."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$BUILD_STATUS" -ne 0 ]]; then
            exit "$BUILD_STATUS"
          fi

      - name: Upload compiler diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-compiler-diagnostics
          path: compiler-diagnostic.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run unit tests without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$DEVICE_ID" -b

          xcodebuild \
            -project Jomado.xcodeproj \
            -scheme Jomado \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$DEBUG_DERIVED_DATA" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building

      - name: Build unsigned device IPA
        shell: bash
        run: |
          set -euo pipefail

          DEVICE_DERIVED_DATA="$RUNNER_TEMP/jomado-device-derived-data"
          IPA_STAGING="$RUNNER_TEMP/jomado-ipa-staging"
          IPA_PATH="$GITHUB_WORKSPACE/Jomado-unsigned.ipa"

          rm -rf "$DEVICE_DERIVED_DATA" "$IPA_STAGING" "$IPA_PATH" "$IPA_PATH.sha256"

          xcodebuild \
            -project Jomado.xcodeproj \
            -scheme Jomado \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DEVICE_DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          APP_PATH="$DEVICE_DERIVED_DATA/Build/Products/Release-iphoneos/Jomado.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Jomado"
          test -d "$APP_PATH/PlugIns/JomadoLiveActivity.appex"

          mkdir -p "$IPA_STAGING/Payload"
          cp -R "$APP_PATH" "$IPA_STAGING/Payload/"

          (
            cd "$IPA_STAGING"
            /usr/bin/zip -qry "$IPA_PATH" Payload
          )

          test -s "$IPA_PATH"
          /usr/bin/unzip -l "$IPA_PATH" | grep -q 'Payload/Jomado.app/Jomado'
          /usr/bin/unzip -l "$IPA_PATH" | grep -q 'Payload/Jomado.app/PlugIns/JomadoLiveActivity.appex/'

          shasum -a 256 "$IPA_PATH" | tee "$IPA_PATH.sha256"

          {
            echo "## Unsigned device IPA"
            echo
            echo "- Built for: iphoneos / generic iOS device"
            echo "- Configuration: Release"
            echo "- Signing: disabled; intended for local re-signing with Sideloadly"
            echo "- Includes Live Activity extension: yes"
            echo
            echo '```text'
            cat "$IPA_PATH.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Jomado-unsigned-ipa
          path: |
            Jomado-unsigned.ipa
            Jomado-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
